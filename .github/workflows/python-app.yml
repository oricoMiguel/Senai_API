name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  BUILD:
    name: Compilar e Testar Projeto
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip' # Otimiza futuras execuções

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Para parar o build em erros de sintaxe ou nomes indefinidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avisos saem como saída, mas não param o build (--exit-zero)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with Pytest
        run: |
          PYTHONPATH=. pytest teste/ -v --tb=short
          
  IMAGEM:
    name: Construindo Imagem no Docker
    runs-on: ubuntu-latest
    needs: BUILD
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4 # OBRIGATÓRIO para o Docker achar o Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USUARIO }} 
          password: ${{ secrets.DOCKER_PWD }} 

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags:  |
            miguelxxx/senai_api_tb:latest
            miguelxxx/senai_api_tb:${{ github.sha }}

  DEPLOY:
    name: Implantando na EC2
    runs-on: ubuntu-latest
    needs: IMAGEM

    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.KEY }}
          script: |
              # Garantir que o Docker está rodando e fazer pull da imagem nova
              sudo docker pull miguelxxx/senai_api_tb:latest
              
              # Parar e remover container antigo (ignora erro se não existir)
              sudo docker stop senai_api_tb || true
              sudo docker rm senai_api_tb || true

              # Rodar o novo container
              # Mapeamento 80(externo):8080(interno do seu app)
              sudo docker run --name senai_api_tb -d \
                --restart unless-stopped \
                -p 80:8080 \
                miguelxxx/senai_api_tb:latest

              # Verificar se o serviço subiu (Healthcheck)
              echo "Aguardando inicialização..."
              sleep 10
              curl -f http://localhost:80/health || (echo "Erro no Healthcheck" && exit 1)
              
              echo "Deploy realizado com sucesso!"
